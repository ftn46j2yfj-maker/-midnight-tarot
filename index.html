<title>午夜牌室｜塔羅</title>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
 <defs>
  <symbol id="o-moon" viewBox="0 0 24 24"><path d="M15.5 3.2a9 9 0 1 0 5.3 15.3A7.4 7.4 0 0 1 15.5 3.2Z" fill="currentColor"/></symbol>
  <symbol id="o-rule" viewBox="0 0 320 24"><g fill="none" stroke="currentColor" stroke-width=".9" stroke-linecap="round"><path d="M4 12h118m76 0h118"/><path d="M30 12l-5-4m15 4-5 4m15-4-5-4m15 4-5 4m15-4-5-4m15 4-5 4m15-4-5-4M290 12l5-4m-15 4 5 4m-15-4 5-4m-15 4 5 4m-15-4 5-4m-15 4 5 4m-15-4 5-4"/><path d="M122 12c8 0 10-7 18-7m58 7c-8 0-10-7-18-7M122 12c8 0 10 7 18 7m58-7c-8 0-10 7-18 7"/><circle cx="160" cy="12" r="9"/><path d="M160 1v22M149 12h22"/></g><path d="M163.5 7.2a5 5 0 1 0 0 9.6 4 4 0 1 1 0-9.6Z" fill="currentColor"/><path d="M4 12l-3-3v6Zm312 0 3-3v6Z" fill="currentColor"/></symbol>
  <symbol id="o-corner" viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"><path d="M2 38V2h36"/><path d="M6 34V6h28" opacity=".55"/><path d="M6 6c10 0 14 4 14 14M6 6c0 10 4 14 14 14" opacity=".8"/><path d="M20 20c3 0 5 2 5 5m-5-5c0 3 2 5 5 5"/></g><path d="M2 2l5 0 0 5z" fill="currentColor"/></symbol>
  
 </defs>

<div class="nave" aria-hidden="true"><i class="fog"></i><i class="fog f2"></i><i class="candle c1"></i><i class="candle c2"></i></div>
<div class="grain" aria-hidden="true"></div>
<a class="skip" href="#draw">跳至選牌</a>
<header class="mast wrap">
<a class="brand" href="./" aria-label="午夜牌室首頁"><svg class="seal" viewBox="0 0 24 24" aria-hidden="true"><use href="#o-moon"/></svg><span>午夜牌室<small>The Vesper Chamber</small></span></a>
<div class="mast-side"><button class="sound-toggle plaque" type="button" id="sound-toggle" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 18V6l11-3v12M9 9l11-3"/><ellipse cx="6.5" cy="18.5" rx="2.5" ry="2"/><ellipse cx="17.5" cy="15.5" rx="2.5" ry="2"/></svg><span id="sound-label">播放音樂</span></button><span class="sr-status" id="sound-status" role="status"></span><audio id="chamber-audio" src="./cathedral-loop.mp3?v=6" preload="none" loop></audio></div>
</header>
<main class="wrap">
<section class="intro" aria-labelledby="title">
 <div class="lancet">
  <p class="kicker"><span aria-hidden="true">✠</span> 燭下之邀 <span aria-hidden="true">✠</span></p>
  <p class="latin" aria-hidden="true">Arcana Magna</p>
  <h1 id="title">午夜，<br>由妳親手<em>翻牌。</em></h1>
  <svg class="rule" viewBox="0 0 320 24" aria-hidden="true"><use href="#o-rule"/></svg>
  <p class="intro-copy">把問題放在心上。<br>哪一張讓妳停下目光，就選那一張。</p>
  <a class="descend" href="#draw"><span>入座選牌</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v15m-6-6 6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></a>
 </div>
</section>
<section id="draw" aria-labelledby="draw-title" class="table">
<div class="table-head"><div><p class="kicker numbered"><span class="numeral" aria-hidden="true">I</span> 牌桌</p><h2 id="draw-title">妳來選牌</h2></div><div class="modes" role="group" aria-label="張數"><button type="button" data-mode="1" aria-pressed="true">單張</button><button type="button" data-mode="3" aria-pressed="false">三張</button></div></div>
<div class="question"><label for="question">想問的事 <span>選填</span></label><input id="question" type="text" maxlength="160" autocomplete="off" placeholder="例如：我可以從哪一步開始？"><p>問題只留在這個頁面，不會傳送或保存。</p></div>
<div class="board" aria-labelledby="board-title">
<svg class="corner tl" aria-hidden="true"><use href="#o-corner"/></svg><svg class="corner tr" aria-hidden="true"><use href="#o-corner"/></svg><svg class="corner bl" aria-hidden="true"><use href="#o-corner"/></svg><svg class="corner br" aria-hidden="true"><use href="#o-corner"/></svg>
<div class="board-head"><div><p class="board-kicker">XXII · Arcana Magna</p><h3 id="board-title">背面朝上</h3></div><button type="button" class="shuffle plaque" id="shuffle" aria-label="重新洗牌">↻ <span>重新洗牌</span></button></div>
<p class="board-status" id="status" role="status" aria-live="polite">牌已洗好。選一張牌，再按「翻開牌」。</p>
<div class="deck" id="deck" role="group" aria-label="二十二張背面朝上的塔羅牌"></div>
<div class="board-end"><span id="counter">已選 0 / 1 張</span><button type="button" id="reveal" class="plaque grand" disabled>翻開牌 <span aria-hidden="true">✦</span></button></div>
</div>
</section>
<section id="reading" class="reading" aria-labelledby="reading-title" hidden tabindex="-1"><svg class="rule" viewBox="0 0 320 24" aria-hidden="true"><use href="#o-rule"/></svg><p class="kicker numbered"><span class="numeral" aria-hidden="true">II</span> 閱讀</p><h2 id="reading-title">妳翻開的牌</h2><p id="echo"></p><div id="results" class="results"></div><div class="reading-end"><button type="button" id="again" class="plaque grand">再抽一次</button><a href="#draw">回到牌桌</a></div></section>
</main>
<footer class="wrap footer"><svg class="rose" viewBox="-50 -50 100 100" aria-hidden="true"><g fill="none" stroke="currentColor"><circle r="47" stroke-width="1.2"/><circle r="40" stroke-width=".6"/><circle r="14" stroke-width="1"/><circle r="6" stroke-width=".8"/><g stroke-width=".8"><path d="M0-14C9-20 9-34 0-40-9-34-9-20 0-14Z" transform="rotate(0)"/><path d="M0-14C9-20 9-34 0-40-9-34-9-20 0-14Z" transform="rotate(30)"/><path d="M0-14C9-20 9-34 0-40-9-34-9-20 0-14Z" transform="rotate(60)"/><path d="M0-14C9-20 9-34 0-40-9-34-9-20 0-14Z" transform="rotate(90)"/><path d="M0-14C9-20 9-34 0-40-9-34-9-20 0-14Z" transform="rotate(120)"/><path d="M0-14C9-20 9-34 0-40-9-34-9-20 0-14Z" transform="rotate(150)"/><path d="M0-14C9-20 9-34 0-40-9-34-9-20 0-14Z" transform="rotate(180)"/><path d="M0-14C9-20 9-34 0-40-9-34-9-20 0-14Z" transform="rotate(210)"/><path d="M0-14C9-20 9-34 0-40-9-34-9-20 0-14Z" transform="rotate(240)"/><path d="M0-14C9-20 9-34 0-40-9-34-9-20 0-14Z" transform="rotate(270)"/><path d="M0-14C9-20 9-34 0-40-9-34-9-20 0-14Z" transform="rotate(300)"/><path d="M0-14C9-20 9-34 0-40-9-34-9-20 0-14Z" transform="rotate(330)"/></g><g stroke-width=".5" stroke-dasharray="1 2.5"><circle r="44"/><circle r="22"/></g></g></svg><span class="latin" aria-hidden="true">Finis</span><span class="name">午夜牌室</span><p>牌不預言，只為思緒留一束光。</p></footer>
<noscript><p class="wrap">這張牌桌需要 JavaScript 才能洗牌和翻牌。</p></noscript>

</html>
